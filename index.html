<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(99, 102, 241, 0.28), transparent 35%),
        linear-gradient(135deg, #0f172a, #111827 55%, #020617);
      color: #f8fafc;
      padding: 24px;
    }

    .card {
      width: min(100%, 640px);
      text-align: center;
      padding: 56px 32px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.18);
      color: #c7d2fe;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.1;
    }

    p {
      margin: 0 auto;
      max-width: 480px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #cbd5e1;
    }

    .status {
      margin-top: 28px;
      color: #93c5fd;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Launching Soon</div>
    <h1>Something awesome is on the way</h1>
    <p>
      We’re putting the finishing touches on our new experience. Check back soon
      for the official launch.
    </p>
    <div class="status">Coming Soon</div>
  </main>
</body>
</html>
